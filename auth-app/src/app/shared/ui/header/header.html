<header class="app-header">
    <div class="app-header__brand">
        <button type="button" class="app-header__menu-button" [attr.aria-expanded]="sidebarOpen" aria-label="Abrir menu"
            (click)="emitMenuToggle()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <a routerLink="/dashboard" class="app-header__logo">
            <span class="app-header__logo-mark">JWT</span>
            <span class="app-header__logo-text">Portal interno</span>
        </a>
    </div>

    <div class="app-header__actions">
        @if (user; as currentUser) {
        <div class="app-header__user-chip">
            <span class="app-header__user-label">Conectado como</span>
            <strong>{{ currentUser.username }}</strong>
        </div>
        }

        <button type="button" class="app-header__logout" (click)="emitLogoutRequest()">
            Sair
        </button>
    </div>
</header>
