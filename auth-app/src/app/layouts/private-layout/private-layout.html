<div class="private-layout">
    <app-header [user]="user()" [sidebarOpen]="sidebarOpen()" (menuToggle)="toggleSidebar()"
        (logoutRequest)="logout()"></app-header>

    <div class="private-layout__body" [class.is-sidebar-collapsed]="sidebarCollapsed()">
        <app-sidebar [open]="sidebarOpen()" [collapsed]="sidebarCollapsed()" (navigate)="closeSidebar()"
            (closeMenu)="closeSidebar()" (toggleCollapse)="toggleSidebarCollapsed()">
        </app-sidebar>

        <button type="button" class="private-layout__backdrop" [class.is-visible]="sidebarOpen()"
            aria-label="Fechar menu" (click)="closeSidebar()"></button>

        <main class="private-layout__content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
